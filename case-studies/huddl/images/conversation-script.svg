<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t">
  <title id="t">Conversation script outline: the patient chat stage of the user flow expands into a scripted path, Step 1 through Step 4, that the AI must pass through</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#fff"/>
  <g font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#777" letter-spacing="1">
    <text x="30" y="40">USER FLOW</text>
    <text x="30" y="236">CONVERSATION SCRIPT: STEPS THE AI MUST PASS THROUGH</text>
  </g>
  <!-- user flow lane -->
  <g fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5">
    <rect x="30" y="60" width="180" height="56" rx="10"/>
    <rect x="270" y="60" width="180" height="56" rx="10"/>
    <rect x="510" y="60" width="180" height="56" rx="10"/>
    <rect x="750" y="60" width="180" height="56" rx="10" fill="#DCDCDC" stroke="#555" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)">
    <path d="M210 88 H268"/>
    <path d="M450 88 H508"/>
    <path d="M690 88 H748"/>
  </g>
  <g font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#333" text-anchor="middle">
    <text x="120" y="93">Education</text>
    <text x="360" y="93">Registration</text>
    <text x="600" y="93">Orders</text>
    <text x="840" y="93">Patient chat</text>
  </g>
  <!-- expansion bracket -->
  <path d="M750 116 L30 210 M930 116 L930 210" fill="none" stroke="#AAA" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="30" y="210" width="900" height="160" rx="14" fill="#F7F7F7" stroke="#AAA" stroke-width="1.2" stroke-dasharray="5 4"/>
  <!-- script steps -->
  <g fill="#fff" stroke="#555" stroke-width="1.5">
    <rect x="70" y="266" width="160" height="60" rx="10"/>
    <rect x="290" y="266" width="160" height="60" rx="10"/>
    <rect x="510" y="266" width="160" height="60" rx="10"/>
    <rect x="730" y="266" width="160" height="60" rx="10"/>
  </g>
  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)">
    <path d="M230 296 H288"/>
    <path d="M450 296 H508"/>
    <path d="M670 296 H728"/>
  </g>
  <g font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#333" text-anchor="middle">
    <text x="150" y="301">Step 1</text>
    <text x="370" y="301">Step 2</text>
    <text x="590" y="301">Step 3</text>
    <text x="810" y="301">Step 4</text>
  </g>
  <text x="70" y="354" font-family="'Space Mono', Consolas, monospace" font-size="10.5" fill="#777">Guides: REMS educational material + user flow diagrams</text>
</svg>
