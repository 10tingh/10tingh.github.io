<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t">
  <title id="t">Low-fidelity chat screen: a Refill renewal thread between a pharmacy team and a patient, message text shown as grey placeholder bars</title>
  <rect width="960" height="520" fill="#fff"/>
  <!-- phone -->
  <rect x="340" y="20" width="280" height="480" rx="32" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="2"/>
  <rect x="440" y="32" width="80" height="8" rx="4" fill="#CFCFCF"/>
  <!-- header -->
  <rect x="360" y="54" width="240" height="44" rx="6" fill="#E6E6E6"/>
  <path d="M380 68 L372 76 L380 84" fill="none" stroke="#555" stroke-width="2"/>
  <text x="480" y="81" text-anchor="middle" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#333">Refill renewal</text>
  <!-- labels -->
  <g font-family="'Space Mono', Consolas, monospace" font-size="9" fill="#888" letter-spacing=".5">
    <text x="364" y="120">PHARMACY TEAM</text>
    <text x="596" y="208" text-anchor="end">PATIENT</text>
    <text x="364" y="272">PHARMACY TEAM</text>
    <text x="596" y="368" text-anchor="end">PATIENT</text>
  </g>
  <!-- incoming (left) -->
  <g fill="#EDEDED" stroke="#B0B0B0">
    <rect x="364" y="128" width="170" height="60" rx="12"/>
    <rect x="364" y="280" width="180" height="64" rx="12"/>
  </g>
  <!-- outgoing (right) -->
  <g fill="#D6D6D6" stroke="#A0A0A0">
    <rect x="456" y="216" width="140" height="40" rx="12"/>
    <rect x="476" y="376" width="120" height="40" rx="12"/>
  </g>
  <g fill="#BDBDBD">
    <rect x="376" y="142" width="140" height="8" rx="4"/>
    <rect x="376" y="158" width="120" height="8" rx="4"/>
    <rect x="376" y="174" width="80" height="6" rx="3"/>
    <rect x="468" y="232" width="110" height="8" rx="4"/>
    <rect x="376" y="294" width="150" height="8" rx="4"/>
    <rect x="376" y="310" width="130" height="8" rx="4"/>
    <rect x="376" y="326" width="90" height="8" rx="4"/>
    <rect x="488" y="392" width="90" height="8" rx="4"/>
  </g>
  <!-- input -->
  <rect x="360" y="440" width="196" height="40" rx="20" fill="#fff" stroke="#A0A0A0"/>
  <rect x="378" y="456" width="100" height="8" rx="4" fill="#DADADA"/>
  <circle cx="580" cy="460" r="18" fill="#BDBDBD"/>
  <path d="M573 460 H587 M581 454 L587 460 L581 466" fill="none" stroke="#fff" stroke-width="2"/>
</svg>
