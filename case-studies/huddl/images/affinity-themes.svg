<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t">
  <title id="t">Affinity diagram: blank sticky notes grouped into two themes, Speed and Coordination</title>
  <defs>
    <g id="notes" fill="#E6E6E6" stroke="#B0B0B0" stroke-width="1">
      <rect x="0" y="0" width="80" height="64" rx="3"/>
      <rect x="98" y="6" width="80" height="64" rx="3"/>
      <rect x="196" y="0" width="80" height="64" rx="3"/>
      <rect x="294" y="6" width="80" height="64" rx="3"/>
      <rect x="0" y="84" width="80" height="64" rx="3"/>
      <rect x="98" y="90" width="80" height="64" rx="3"/>
      <rect x="196" y="84" width="80" height="64" rx="3"/>
      <rect x="294" y="90" width="80" height="64" rx="3"/>
    </g>
  </defs>
  <rect width="960" height="400" fill="#fff"/>
  <g fill="#F7F7F7" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="6 5">
    <rect x="30" y="30" width="430" height="340" rx="16"/>
    <rect x="500" y="30" width="430" height="340" rx="16"/>
  </g>
  <use href="#notes" x="58" y="170"/>
  <use href="#notes" x="528" y="170"/>
  <g font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#777" letter-spacing="1">
    <text x="58" y="68">THEME 1</text>
    <text x="528" y="68">THEME 2</text>
  </g>
  <g font-family="Nunito, 'Segoe UI', system-ui, sans-serif" fill="#333">
    <text x="58" y="104" font-size="26" font-weight="800">Speed</text>
    <text x="58" y="134" font-size="15">Completing the process was slow and inefficient.</text>
    <text x="528" y="104" font-size="26" font-weight="800">Coordination</text>
    <text x="528" y="134" font-size="15">Working together was frustrating for both sides.</text>
  </g>
</svg>
