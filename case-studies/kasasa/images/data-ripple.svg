<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t">
  <title id="t">Before: separate tools, each configured by hand, not connected. After: one input in SureLock ripples through Kasasa Cash, Everyday Rewards, and Take-Back Loans</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#fff"/>
  <line x1="400" y1="30" x2="400" y2="430" stroke="#DDD" stroke-width="1.5"/>

  <g font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#777" letter-spacing="1">
    <text x="40" y="44">BEFORE: SEPARATE TOOLS</text>
    <text x="440" y="44">AFTER: DATA PERSISTS</text>
  </g>

  <!-- before: disconnected tools -->
  <g fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="5 4">
    <rect x="90" y="80" width="220" height="80" rx="8"/>
    <rect x="90" y="200" width="220" height="80" rx="8"/>
    <rect x="90" y="320" width="220" height="80" rx="8"/>
  </g>
  <g font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#333" text-anchor="middle">
    <text x="200" y="116">Separate tool</text>
    <text x="200" y="236">Separate tool</text>
    <text x="200" y="356">Separate tool</text>
  </g>
  <g font-family="'Space Mono', Consolas, monospace" font-size="10" fill="#777" text-anchor="middle" letter-spacing=".5">
    <text x="200" y="140">CONFIGURED BY HAND</text>
    <text x="200" y="260">CONFIGURED BY HAND</text>
    <text x="200" y="380">CONFIGURED BY HAND</text>
  </g>

  <!-- after: one input ripples -->
  <rect x="460" y="190" width="180" height="100" rx="10" fill="#E2E2E2" stroke="#8A8A8A" stroke-width="1.5"/>
  <rect x="480" y="244" width="140" height="28" rx="6" fill="#fff" stroke="#8A8A8A" stroke-width="1.5"/>
  <g fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5">
    <rect x="720" y="90" width="200" height="64" rx="10"/>
    <rect x="720" y="208" width="200" height="64" rx="10"/>
    <rect x="720" y="326" width="200" height="64" rx="10"/>
  </g>
  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)">
    <path d="M640 230 C680 230 680 122 718 122"/>
    <path d="M640 240 H718"/>
    <path d="M640 250 C680 250 680 358 718 358"/>
  </g>
  <g font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#333" text-anchor="middle">
    <text x="550" y="224" font-size="16" font-weight="800">SureLock</text>
    <text x="820" y="127">Kasasa Cash</text>
    <text x="820" y="245">Everyday Rewards</text>
    <text x="820" y="363">Take-Back Loans</text>
  </g>
  <text x="550" y="263" text-anchor="middle" font-family="'Space Mono', Consolas, monospace" font-size="10" fill="#777" letter-spacing=".5">ONE INPUT</text>
</svg>
