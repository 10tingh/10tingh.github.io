<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t">
  <title id="t">Demo timeline: an action step, followed by the email it triggers, inserted as its own collateral moment in the flow. Screen text shown as grey placeholder bars</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#fff"/>
  <g font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#777" letter-spacing="1">
    <text x="30" y="40">DEMO TIMELINE</text>
  </g>

  <!-- screen 1: action -->
  <rect x="190" y="70" width="220" height="340" rx="26" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="2"/>
  <rect x="270" y="82" width="60" height="7" rx="3.5" fill="#CFCFCF"/>
  <rect x="206" y="102" width="188" height="36" rx="6" fill="#E6E6E6"/>
  <g fill="#DADADA">
    <rect x="206" y="156" width="188" height="48" rx="8"/>
    <rect x="206" y="216" width="188" height="48" rx="8"/>
    <rect x="206" y="276" width="120" height="10" rx="5"/>
  </g>
  <rect x="206" y="340" width="188" height="44" rx="22" fill="#BDBDBD"/>

  <!-- screen 2: email it triggers -->
  <rect x="540" y="62" width="240" height="356" rx="30" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="550" y="70" width="220" height="340" rx="26" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="2"/>
  <rect x="630" y="82" width="60" height="7" rx="3.5" fill="#CFCFCF"/>
  <rect x="566" y="102" width="188" height="36" rx="6" fill="#E6E6E6"/>
  <!-- envelope -->
  <rect x="630" y="160" width="60" height="42" rx="4" fill="#EDEDED" stroke="#8A8A8A" stroke-width="1.5"/>
  <path d="M630 162 L660 186 L690 162" fill="none" stroke="#8A8A8A" stroke-width="1.5"/>
  <g fill="#DADADA">
    <rect x="566" y="224" width="188" height="10" rx="5"/>
    <rect x="566" y="244" width="160" height="10" rx="5"/>
    <rect x="566" y="264" width="176" height="10" rx="5"/>
    <rect x="566" y="284" width="110" height="10" rx="5"/>
  </g>

  <path d="M412 240 H538" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- timeline -->
  <line x1="80" y1="460" x2="880" y2="460" stroke="#8A8A8A" stroke-width="1.5"/>
  <g fill="#BDBDBD">
    <circle cx="110" cy="460" r="6"/>
    <circle cx="300" cy="460" r="8" fill="#8A8A8A"/>
    <circle cx="660" cy="460" r="8" fill="#8A8A8A"/>
    <circle cx="850" cy="460" r="6"/>
  </g>
  <g font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#333" text-anchor="middle">
    <text x="300" y="492">Action</text>
    <text x="660" y="492">Email</text>
  </g>
  <text x="660" y="54" text-anchor="middle" font-family="'Space Mono', Consolas, monospace" font-size="10" fill="#777" letter-spacing=".5">COLLATERAL, ADDED AFTER TESTING</text>
</svg>
