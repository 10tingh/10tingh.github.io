<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t">
  <title id="t">A product card for a cup with a recommended lid beside it, marked as a compatible fit, each with its own add button. Grey blocks stand in for photos.</title>
  <rect width="960" height="340" fill="#fff"/>

  <!-- cup card -->
  <rect x="170" y="40" width="260" height="260" rx="14" fill="#FAFAFA" stroke="#BBB" stroke-width="1.5"/>
  <rect x="190" y="60" width="220" height="130" rx="8" fill="#E6E6E6"/>
  <text x="190" y="222" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#333">Cup</text>
  <rect x="190" y="244" width="220" height="38" rx="19" fill="#555"/>
  <text x="300" y="268" font-family="'Space Mono', Consolas, monospace" font-size="12" fill="#fff" text-anchor="middle" letter-spacing="1">ADD</text>

  <!-- plus -->
  <g stroke="#8A8A8A" stroke-width="3" stroke-linecap="round">
    <line x1="480" y1="155" x2="480" y2="185"/>
    <line x1="465" y1="170" x2="495" y2="170"/>
  </g>

  <!-- recommended lid card -->
  <rect x="530" y="40" width="260" height="260" rx="14" fill="#FAFAFA" stroke="#555" stroke-width="2"/>
  <text x="550" y="30" font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#777" letter-spacing="1">RECOMMENDED</text>
  <rect x="550" y="60" width="220" height="130" rx="8" fill="#E6E6E6"/>
  <text x="550" y="222" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#333">Lid</text>
  <rect x="640" y="205" width="130" height="24" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <path d="M652 217 l5 5 l9 -10" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="674" y="221" font-family="'Space Mono', Consolas, monospace" font-size="10" fill="#333" letter-spacing=".5">COMPATIBLE</text>
  <rect x="550" y="244" width="220" height="38" rx="19" fill="#555"/>
  <text x="660" y="268" font-family="'Space Mono', Consolas, monospace" font-size="12" fill="#fff" text-anchor="middle" letter-spacing="1">ADD</text>
</svg>
