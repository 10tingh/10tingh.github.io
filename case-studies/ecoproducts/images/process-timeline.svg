<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t">
  <title id="t">Process over about 2 months: watch user sessions, then map the existing architecture, then user interviews, then an open card sort, then a closed card sort, then the new architecture in FigJam</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#fff"/>
  <text x="40" y="44" font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#777" letter-spacing="1">PROCESS · ABOUT 2 MONTHS</text>

  <!-- spine -->
  <line x1="40" y1="150" x2="930" y2="150" stroke="#8A8A8A" stroke-width="2" marker-end="url(#a)"/>

  <!-- step dots -->
  <g fill="#F2F2F2" stroke="#555" stroke-width="2">
    <circle cx="100" cy="150" r="10"/>
    <circle cx="250" cy="150" r="10"/>
    <circle cx="400" cy="150" r="10"/>
    <circle cx="550" cy="150" r="10"/>
    <circle cx="700" cy="150" r="10"/>
  </g>
  <circle cx="850" cy="150" r="12" fill="#555"/>

  <g font-family="'Space Mono', Consolas, monospace" font-size="10" fill="#777" letter-spacing=".5" text-anchor="middle">
    <text x="100" y="120">01</text>
    <text x="250" y="120">02</text>
    <text x="400" y="120">03</text>
    <text x="550" y="120">04</text>
    <text x="700" y="120">05</text>
    <text x="850" y="120">06</text>
  </g>

  <g font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="800" fill="#333" text-anchor="middle">
    <text x="100" y="192">Watch user</text>
    <text x="100" y="210">sessions</text>
    <text x="250" y="192">Map the existing</text>
    <text x="250" y="210">architecture</text>
    <text x="400" y="192">User</text>
    <text x="400" y="210">interviews</text>
    <text x="550" y="192">Open</text>
    <text x="550" y="210">card sort</text>
    <text x="700" y="192">Closed</text>
    <text x="700" y="210">card sort</text>
    <text x="850" y="192">New architecture</text>
    <text x="850" y="210">in FigJam</text>
  </g>
</svg>
