<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t">
  <title id="t">A search for the user's name for a product finds it, because the user's name is attached to the product as a backend label while the store still shows EcoProducts' name</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="320" fill="#fff"/>

  <!-- search box -->
  <text x="40" y="104" font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#777" letter-spacing="1">SEARCH</text>
  <rect x="40" y="116" width="300" height="48" rx="24" fill="#FAFAFA" stroke="#555" stroke-width="2"/>
  <circle cx="70" cy="138" r="8" fill="none" stroke="#555" stroke-width="2"/>
  <line x1="76" y1="144" x2="83" y2="151" stroke="#555" stroke-width="2" stroke-linecap="round"/>
  <text x="96" y="146" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#333">the user's name</text>

  <!-- arrow -->
  <line x1="360" y1="140" x2="500" y2="140" stroke="#8A8A8A" stroke-width="2" marker-end="url(#a)"/>

  <!-- product -->
  <text x="520" y="44" font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#777" letter-spacing="1">PRODUCT</text>
  <rect x="520" y="56" width="400" height="230" rx="14" fill="#FAFAFA" stroke="#BBB" stroke-width="1.5"/>
  <rect x="540" y="76" width="110" height="110" rx="8" fill="#E6E6E6"/>
  <text x="670" y="104" font-family="'Space Mono', Consolas, monospace" font-size="10" fill="#777" letter-spacing=".5">SHOWN IN THE STORE</text>
  <text x="670" y="128" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#333">EcoProducts' name</text>

  <rect x="540" y="208" width="360" height="58" rx="8" fill="none" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="560" y="230" font-family="'Space Mono', Consolas, monospace" font-size="10" fill="#777" letter-spacing=".5">LABEL ON THE BACKEND</text>
  <text x="560" y="253" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#333">the user's name</text>
</svg>
