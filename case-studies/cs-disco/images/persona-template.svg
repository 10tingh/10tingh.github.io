<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t">
  <title id="t">Blank persona template with five fields: needs, goals, motivations, frustrations, and fit in a legal office's workflow. Field labels only; content is shown as grey placeholder bars</title>
  <rect width="960" height="520" fill="#fff"/>
  <text x="40" y="44" font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#777" letter-spacing="1">PERSONA TEMPLATE</text>

  <!-- card -->
  <rect x="180" y="70" width="600" height="420" rx="16" fill="#FAFAFA" stroke="#8A8A8A" stroke-width="1.5"/>

  <!-- header: avatar + name placeholder -->
  <circle cx="236" cy="124" r="28" fill="#E2E2E2" stroke="#A0A0A0"/>
  <g fill="#BDBDBD">
    <rect x="282" y="108" width="180" height="12" rx="6"/>
    <rect x="282" y="130" width="120" height="8" rx="4"/>
  </g>
  <line x1="180" y1="176" x2="780" y2="176" stroke="#DADADA"/>

  <!-- fields -->
  <g fill="#fff" stroke="#C8C8C8">
    <rect x="204" y="196" width="270" height="84" rx="10"/>
    <rect x="486" y="196" width="270" height="84" rx="10"/>
    <rect x="204" y="292" width="270" height="84" rx="10"/>
    <rect x="486" y="292" width="270" height="84" rx="10"/>
    <rect x="204" y="388" width="552" height="84" rx="10"/>
  </g>
  <g font-family="'Space Mono', Consolas, monospace" font-size="10" fill="#555" letter-spacing=".8">
    <text x="220" y="218">NEEDS</text>
    <text x="502" y="218">GOALS</text>
    <text x="220" y="314">MOTIVATIONS</text>
    <text x="502" y="314">FRUSTRATIONS</text>
    <text x="220" y="410">FIT IN A LEGAL OFFICE'S WORKFLOW</text>
  </g>
  <g fill="#D6D6D6">
    <rect x="220" y="234" width="220" height="7" rx="3"/><rect x="220" y="250" width="170" height="7" rx="3"/>
    <rect x="502" y="234" width="210" height="7" rx="3"/><rect x="502" y="250" width="180" height="7" rx="3"/>
    <rect x="220" y="330" width="200" height="7" rx="3"/><rect x="220" y="346" width="230" height="7" rx="3"/>
    <rect x="502" y="330" width="226" height="7" rx="3"/><rect x="502" y="346" width="160" height="7" rx="3"/>
    <rect x="220" y="426" width="480" height="7" rx="3"/><rect x="220" y="442" width="380" height="7" rx="3"/>
  </g>
</svg>
