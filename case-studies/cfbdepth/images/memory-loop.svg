<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="t">
  <title id="t">Memory loop: session ends, memory updated with user type, teams, data preferences, and betting factors, memory loaded, next session starts, then the loop repeats. Loading memory is an extra call every session</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#fff"/>
  <text x="40" y="44" font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#777" letter-spacing="1">AGENT MEMORY LOOP</text>

  <!-- nodes -->
  <g fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5">
    <rect x="80" y="80" width="240" height="64" rx="10"/>
    <rect x="80" y="330" width="240" height="64" rx="10"/>
    <rect x="640" y="330" width="240" height="64" rx="10"/>
  </g>
  <rect x="600" y="64" width="320" height="200" rx="12" fill="#E2E2E2" stroke="#8A8A8A" stroke-width="1.5"/>

  <g font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#333" text-anchor="middle">
    <text x="200" y="118">Session ends</text>
    <text x="760" y="98">Memory updated</text>
    <text x="760" y="368">Memory loaded</text>
    <text x="200" y="368">Next session starts</text>
  </g>

  <!-- memory contents -->
  <g fill="#fff" stroke="#A0A0A0">
    <rect x="624" y="114" width="272" height="30" rx="6"/>
    <rect x="624" y="150" width="272" height="30" rx="6"/>
    <rect x="624" y="186" width="272" height="30" rx="6"/>
    <rect x="624" y="222" width="272" height="30" rx="6"/>
  </g>
  <g font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#555" letter-spacing=".5">
    <text x="640" y="134">USER TYPE</text>
    <text x="640" y="170">TEAMS</text>
    <text x="640" y="206">DATA PREFERENCES</text>
    <text x="640" y="242">BETTING FACTORS</text>
  </g>

  <!-- loop arrows -->
  <g fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#a)">
    <path d="M320 112 H598"/>
    <path d="M760 264 V328"/>
    <path d="M640 362 H322"/>
    <path d="M200 330 V146"/>
  </g>
  <text x="460" y="100" text-anchor="middle" font-family="'Space Mono', Consolas, monospace" font-size="9" fill="#777" letter-spacing=".5">AFTER EVERY CONVERSATION</text>

  <!-- extra call marker -->
  <rect x="380" y="380" width="200" height="32" rx="16" fill="#D6D6D6" stroke="#555" stroke-width="1.5"/>
  <text x="480" y="400" text-anchor="middle" font-family="'Space Mono', Consolas, monospace" font-size="10" fill="#333" letter-spacing=".5">EXTRA CALL EVERY SESSION</text>
</svg>
