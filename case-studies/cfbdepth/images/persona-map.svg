<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t">
  <title id="t">Persona map: CFBDepth's data at the center, connected to three user types: team fans, bettors, and subscribers, each with what they want from the data</title>
  <rect width="960" height="440" fill="#fff"/>
  <text x="40" y="44" font-family="'Space Mono', Consolas, monospace" font-size="11" fill="#777" letter-spacing="1">USER PERSONAS</text>

  <!-- center -->
  <rect x="370" y="70" width="220" height="70" rx="10" fill="#E2E2E2" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="480" y="102" text-anchor="middle" font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#333">CFBDepth data</text>
  <text x="480" y="124" text-anchor="middle" font-family="'Space Mono', Consolas, monospace" font-size="10" fill="#777" letter-spacing=".5">DATA SHEETS</text>

  <!-- connectors -->
  <g fill="none" stroke="#8A8A8A" stroke-width="1.5">
    <path d="M440 140 C440 190 170 190 170 230"/>
    <path d="M480 140 V230"/>
    <path d="M520 140 C520 190 790 190 790 230"/>
  </g>

  <!-- persona cards -->
  <g fill="#F2F2F2" stroke="#8A8A8A" stroke-width="1.5">
    <rect x="50" y="230" width="240" height="170" rx="12"/>
    <rect x="360" y="230" width="240" height="170" rx="12"/>
    <rect x="670" y="230" width="240" height="170" rx="12"/>
  </g>
  <g fill="#C8C8C8">
    <circle cx="80" cy="262" r="14"/>
    <circle cx="390" cy="262" r="14"/>
    <circle cx="700" cy="262" r="14"/>
  </g>
  <g font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#333">
    <text x="106" y="268">Team fans</text>
    <text x="416" y="268">Bettors</text>
    <text x="726" y="268">Subscribers</text>
  </g>
  <g font-family="'Space Mono', Consolas, monospace" font-size="10" fill="#777" letter-spacing=".5">
    <text x="70" y="306">WANTS</text>
    <text x="380" y="306">WANTS</text>
    <text x="690" y="306">WANTS</text>
  </g>
  <g font-family="Nunito, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#444">
    <text x="70" y="330">Updates on their</text>
    <text x="70" y="350">teams' players</text>
    <text x="380" y="330">The factors they weigh</text>
    <text x="380" y="350">when betting and</text>
    <text x="380" y="370">making picks</text>
    <text x="690" y="330">Live stats and</text>
    <text x="690" y="350">analytics</text>
  </g>
</svg>
